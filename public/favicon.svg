<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded container with rich aquatic navy gradient -->
  <rect width="64" height="64" rx="14" fill="url(#poolGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Accent swimmer dot / water drop -->
  <circle cx="32" cy="17" r="3.5" fill="#38bdf8" />

  <!-- Swimming pool waves -->
  <path d="M13 28 C17 24, 21 32, 25 28 C29 24, 33 32, 37 28 C41 24, 45 32, 51 28" 
        stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M13 36 C17 32, 21 40, 25 36 C29 32, 33 40, 37 36 C41 32, 45 40, 51 36" 
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <path d="M13 44 C17 40, 21 48, 25 44 C29 40, 33 48, 37 44 C41 40, 45 48, 51 44" 
        stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <defs>
    <linearGradient id="poolGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#022448" />
      <stop offset="1" stop-color="#1e3a5f" />
    </linearGradient>
  </defs>
</svg>